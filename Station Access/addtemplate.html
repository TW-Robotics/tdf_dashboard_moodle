<div class="bk bk-form ac-form">
  <h4>Give access to a station</h4>
  <p class="bk-intro">Leader: add supervisors (and students). Supervisors: add students to your own stations. Type part of a name and click the person.</p>
  <div class="bkf acf-station"><label>Station</label><div class="bkf-in">[[station]]</div></div>
  <div class="bkf acf-person"><label>Person (full name)</label><div class="bkf-in">[[person]]</div></div>
  <div class="bkf acf-role"><label>Role</label><div class="bkf-in">[[role]]</div></div>
  <div class="bkf acf-note"><label>Note</label><div class="bkf-in">[[note]]</div></div>
  <div class="bk-checkbox" id="ac-check" role="status" aria-live="polite">Checking your rights…</div>
</div>
