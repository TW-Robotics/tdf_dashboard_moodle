<div class="tdf tdf-single">
  <div class="tdf-card tdf-[[status]]">
    <div class="tdf-row"><span class="tdf-cell">[[cell]]</span><span class="tdf-pill"><i></i><span class="tdf-status">[[status]]</span></span></div>
    <h3 class="tdf-name">[[robot]]</h3>
    <div class="tdf-who"><span class="tdf-person">[[person]]</span><span class="tdf-until">[[until]]</span></div>
    <div class="tdf-note">[[note]]</div>
    <table class="tdf-data">
      <tr><th>Maker</th><td>[[maker]]</td></tr>
      <tr><th>Type</th><td>[[type]]</td></tr>
      <tr><th>Location</th><td>[[cell]]</td></tr>
      <tr><th>IP address</th><td>[[ip]]</td></tr>
      <tr><th>Setup guide</th><td>[[guide]]</td></tr>
      <tr><th>Last updated</th><td>##timemodified## by ##user##</td></tr>
    </table>
    <div class="tdf-foot"><span></span><span class="tdf-actions">##edit## ##delete##</span></div>
  </div>
</div>
