<div class="bk">
  <div class="bk-e bk-single" data-id="##id##">
    <div class="bk-e-top"><span class="bk-when"><span class="bk-date">[[date]]</span><span class="bk-sep"> · </span><span class="bk-from">[[from]]</span>–<span class="bk-to">[[to]]</span></span></div>
    <div class="bk-robot">[[robot]]</div>
    <table class="bk-data">
      <tr><th>Booked by</th><td class="bk-user">##user##</td></tr>
      <tr><th>Note</th><td class="bk-note">[[note]]</td></tr>
      <tr><th>Booked on</th><td>##timeadded##</td></tr>
    </table>
    <div class="bk-actions">##edit## ##delete##</div>
  </div>
</div>
