<div class="bk bk-form">
  <p class="bk-intro">Book a robot by the hour (Mon–Fri, 08:00–18:00, max. 10 hours). Your Moodle name is saved with the booking.</p>
  <div class="bkf bkf-robot"><label>Robot</label><div class="bkf-in">[[robot]]</div></div>
  <div class="bkf bkf-date"><label>Date</label><div class="bkf-in">[[date]]</div></div>
  <div class="bkf bkf-time"><label>Time</label><div class="bkf-in"><span class="bkf-from">[[from]]</span><span class="bkf-dash">to</span><span class="bkf-to">[[to]]</span></div></div>
  <div class="bkf bkf-note"><label>Project or note</label><div class="bkf-in">[[note]]</div></div>
  <div class="bk-checkbox" id="bk-check" role="status" aria-live="polite">Choose a robot, date and time.</div>
</div>
